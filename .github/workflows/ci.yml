name: CI

# Lint + testes unitários (api/web) + e2e de browser (Playwright, hermético — sem S3/DB).
on:
  push:
    branches: [master]
  pull_request:

# Cancela execuções antigas do mesmo ref ao empurrar de novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API · lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os pacotes consomem @atena/types compilado (dist); a api importa o cliente Prisma gerado.
      - run: npm run build -w @atena/types
      - run: npm run prisma:generate -w apps/api
      - run: npm run lint -w apps/api
      - run: npm test -w apps/api

  web:
    name: Web · lint + unit + e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - run: npm run lint -w @atena/web
      - run: npm run typecheck:e2e -w @atena/web
      - run: npm test -w @atena/web
      # Browser + libs do SO para o Chromium do Playwright.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Hermético: o webServer do Playwright builda o web e o serve; as chamadas /api/** são mockadas.
      - run: npm run e2e -w @atena/web
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
