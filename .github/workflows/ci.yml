name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel older runs of the same ref when a new commit is pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The git hooks are for local commits; CI runs the checks as jobs.
  HUSKY: '0'

# One job per check, so each one can be a required status check on its own. The workspaces
# consume @atena/types from its build (dist), and the API needs the generated Prisma client, so
# the jobs that compile or type-check code build both first.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - run: npm run prisma:generate
      - name: ESLint (root tooling and every workspace), warnings fail
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - run: npm run prisma:generate
      - run: npm run typecheck

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - name: Layer rules and cycles (dependency-cruiser)
        run: npm run check:architecture

  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unused files, exports and dependencies (knip)
        run: npm run check:unused

  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - run: npm run prisma:generate
      - name: API tests with the 80% coverage gate
        run: npm run test:coverage -w @atena/api
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage-api
          path: apps/api/coverage/
          retention-days: 14

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      - name: Web unit tests with the coverage floor (see vite.config.ts)
        run: npm run test:coverage -w @atena/web
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: coverage-web
          path: apps/web/coverage/
          retention-days: 14

  e2e-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @atena/types
      # Browser and OS libraries for Playwright's Chromium.
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # Hermetic: Playwright's webServer builds and serves the web app; every /api/** call is mocked.
      - run: npm run e2e -w @atena/web
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests of the local ESLint rules and the context script
        run: npm run test:tooling

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Production dependencies, high severity and above
        run: npm audit --omit=dev --audit-level=high

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Agent surfaces are copies of .context/docs/README.md
        run: npm run check:context

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Every commit of the pull request follows Conventional Commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
