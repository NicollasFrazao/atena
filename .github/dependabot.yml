version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Majors that are migrations, not bumps; each has its issue. Remove the hold when it is done.
      - dependency-name: '@nestjs/*' # #25
        update-types: ['version-update:semver-major']
      - dependency-name: 'react' # #32
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom' # #32
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react' # #32
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react-dom' # #32
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-router-dom' # #32
        update-types: ['version-update:semver-major']
      - dependency-name: 'prisma' # #44
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client' # #44
        update-types: ['version-update:semver-major']
      # The runtime is Node 22 (CI, API image) with engines >=20; the types move with it, not ahead of it.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint has no support for TypeScript 7 yet; revisit when it does.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-router-dom'
          - '@tanstack/*'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@stylistic/*'
          - 'typescript-eslint'
      test:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
