version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'react-router-dom'
          - '@tanstack/*'
      lint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@stylistic/*'
          - 'typescript-eslint'
      test:
        patterns:
          - 'jest'
          - 'ts-jest'
          - '@types/jest'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/test'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
